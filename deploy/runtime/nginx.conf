worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  keepalive_timeout 15s;
  client_body_timeout 30s;
  client_header_timeout 10s;
  # Soundboard uploads are capped at 10 MB by YAGPDB.
  client_max_body_size 12m;
  # nginx runs as uid 101 on a read-only root: every temp dir must live on /tmp.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  # Client IP from Cloudflare, accepted only from the Docker proxy network
  # (Nginx Proxy Manager). Without the header $remote_addr stays the proxy.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;

  server {
    listen 8080;

    location / {
      proxy_http_version 1.1;
      proxy_pass http://steward:5000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      # YAGPDB reads the client address from X-Real-IP
      # (YAGPDB_WEB_REVERSE_PROXY_CLIENT_IP_HEADER in docker-compose.yml).
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection "";
    }
  }
}
